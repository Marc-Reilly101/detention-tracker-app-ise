<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St. Colman's | Detention Book</title>
    <link rel="stylesheet" href="style.css"/>
    <!-- link to style.css for stylesheet -->

    <link rel="icon" href="assets/crest.png"/>
    <!-- use crest.png (St. Colman's crest) for tab icon -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- link "Poppins" font from google fonts - cleaner than Arial -->
</head>
<body>
    <div id="app">
        <!-- app div contains entire single-page application. Useful for app.js (for element resizing on mobile devices) -->
        <div id="passwordscreen" class="centered">
            <img style="width: 250px; height: 250px;" src="assets/crest.png"/> </p>
            <h1>St. Colman's College</h1>
            <h2>Detention Book</h2>
            <input type="password" class="textbox" style="height: 45px; width: 400px;" placeholder="Enter administrative password..." id="passwordscreen_passwordBox"/> </p>
            <!-- Initially went with height: 55px, but it looked too thick. 45 pixels just right -->
            <button class="button" onclick="logIn()">Submit</button> </p>
        </div>



        <div id="loadingscreen" class="centered hidden">
            <img style="width: 250px; height: 250px;" src="assets/crest.png"/> </p>
            <!-- 150px * 150px was also too small -->
            <i>Loading...</i> </p>
            <i>Fetching Data...</i> </p>
        </div>



        <div id="mainscreen" class="hidden">
            <div class="header"><b>St. Colman's | Detention Book</b></div>
            <!-- webcontent classes used to establish margin sizes, and element alignment -->
            <div class="webcontent">
                <button class="button" onclick="UI.goTo('addstudentscreen', 'mainscreen')">Add Student (+)</button>

                <select id="mainscreen_yearFilter" class="selectionBox">
                    <option>All Years</option>
                    <option>First Year</option>
                    <option>Second Year</option>
                    <option>Third Year</option>
                    <option>Transition Year</option>
                    <option>Fifth Year</option>
                    <option>Sixth Year</option>
                </select>
                <!-- year groups defined literally in HTML -->

                <select id="mainscreen_timeFilter" class="selectionBox">
                    <option>All</option>
                    <option>Today</option>
                    <option>Upcoming</option>
                </select>
                <!-- same for "time filters" -->

                <div id="mainscreen_toolbar" style="float: right;">
                    <b class="underline-hover" style="margin-right: 12px;" onclick="UI.goTo('recordscreen', 'mainscreen')">Records</b>
                    <b class="underline-hover" style="margin-right: 12px;" onclick="UI.goTo('profilesearchscreen', 'mainscreen')">Profiles</b>
                    <b class="underline-hover" style="margin-right: 12px;" onclick="attendanceFunctions.verifyDetentionToday()">Attendance</b>
                </div> </p>
                <b style="color: red;" class="underline-hover hidden" id="mainscreen_fridayDetentionNotice" onclick="UI.goTo('fridaydetentionsneededscreen', 'mainscreen')"></b> </p>
                <hr/>
                <u><b><i>Date Format: yyyy-mm-dd</i></b></u> </p>
                <i id="mainscreen_emptyLabel" style="display: none;">Nothing here at the moment...</i> </p>
                <div id="mainscreen_detentionsList"></div>
            </div>
        </div>
    </div>
</body>
